
services:
  backend:
    image: ghcr.io/lambdaiith/dashboard:latest
    # build: ./backend # Uncomment this line if you want to build the image locally
    container_name: dashboard-backend
    restart: always
    ports:
      - "1234:8000"
    env_file:
      - /home/ubuntu/dashboard-production/.env
    environment:
      MESS_MENU_DATA_DIR: /backend/mess-menu-data
    volumes:
      - /home/ubuntu/dashboard-production/credentials.json:/backend/job_scripts/credentials.json
      - /home/ubuntu/dashboard-production/mess-menu:/backend/mess-menu-data
      - /home/ubuntu/dashboard-production/cityBus.json:/backend/Routes/Transport/cityBus.json
      - /home/ubuntu/dashboard-production/transport.json:/backend/Routes/Transport/transport.json
      - /home/ubuntu/dashboard-production/all_courses.json:/backend/Routes/TimeTable/all_courses.json
      - /home/ubuntu/dashboard-production/serviceAccount.json:/backend/serviceAccount.json
    command: uvicorn main:app --host 0.0.0.0 --port 8000
